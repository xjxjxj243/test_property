<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物权法（第1-5周）全量真题测试系统</title>
    <style>
        :root {
            --bg-color: #F8F4EE;
            --card-bg: #FFFDF9;
            --primary-color: #7A3E1D;
            --accent-color: #C06028;
            --accent-hover: #A04D1B;
            --text-color: #382E26;
            --text-muted: #736356;
            --border-color: #E6D8C8;
            --success-color: #2D6A4F;
            --success-bg: #EAF4EE;
            --danger-color: #9E2A2B;
            --danger-bg: #FAF0F0;
            --warning-color: #B57614;
            --warning-bg: #FCF7E8;
            --box-shadow: 0 4px 12px rgba(122, 62, 29, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
        h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #EDE4D8; padding: 6px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; border-radius: 7px; cursor: pointer; font-weight: bold; color: var(--text-muted); font-size: 0.98rem; transition: all 0.2s; }
        .tab-btn.active { background: var(--card-bg); color: var(--primary-color); box-shadow: 0 2px 5px rgba(122, 62, 29, 0.1); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px 30px; box-shadow: var(--box-shadow); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-color); }
        .badge { background: #F4EAE0; color: var(--primary-color); padding: 5px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; border: 1px solid #E2D2C1; }
        .question-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; color: var(--text-color); line-height: 1.7; }
        .case-box { background: #F5EDE4; border-left: 4px solid var(--accent-color); padding: 16px 20px; margin-bottom: 22px; border-radius: 0 8px 8px 0; font-size: 0.98rem; line-height: 1.75; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
        .option-btn { text-align: left; padding: 14px 20px; border: 1.5px solid var(--border-color); border-radius: 8px; background: #FFFDF9; color: var(--text-color); cursor: pointer; font-size: 1rem; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
        .option-btn:hover:not(:disabled) { border-color: var(--accent-color); background: #FBF4EC; }
        .option-btn.selected-correct { border-color: var(--success-color); background: var(--success-bg); color: var(--success-color); font-weight: bold; }
        .option-btn.selected-wrong { border-color: var(--danger-color); background: var(--danger-bg); color: var(--danger-color); font-weight: bold; }
        .option-btn.show-correct { border-color: var(--success-color); background: var(--success-bg); color: var(--success-color); }
        .explanation-box { margin-top: 22px; padding: 18px 22px; border-radius: 8px; background: #F5EFE8; border: 1px solid #E2D5C7; display: none; }
        .explanation-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
        .btn { padding: 11px 24px; border: none; border-radius: 7px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background: var(--accent-color); color: #FFFDF9; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-primary:disabled { background: #D9CBBF; color: #8C7B6E; cursor: not-allowed; }
        .btn-outline { border: 1px solid var(--border-color); background: #FFFDF9; color: var(--text-color); }
        .btn-outline:hover { background: #F7EFE7; }
        .btn-fav { color: var(--warning-color); border-color: #E0C79B; background: var(--warning-bg); }
        .btn-fav.active { background: var(--warning-color); color: #FFFDF9; }
        .stats-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 16px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--box-shadow); }
        .stat-num { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .hidden { display: none !important; }
        .result-summary { text-align: center; padding: 35px 20px; }
        .score-display { font-size: 3.4rem; font-weight: bold; color: var(--accent-color); margin: 15px 0; }
        .q-item-box { padding: 18px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 16px; background: #FFFDF9; }
        .q-item-title { font-weight: bold; margin-bottom: 10px; color: var(--text-color); line-height: 1.6; }
        .q-item-exp { color: var(--primary-color); font-size: 0.92rem; margin-top: 10px; background: #F5EDE4; padding: 10px 14px; border-radius: 6px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>物权法（第1-5周）基础知识自测</h1>
        <div class="subtitle">护眼版丨 8单选 + 10判断 + 1案例（含3小问）套题抽选</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')">🎲 抽取测试套题</button>
        <button class="tab-btn" onclick="switchTab('mistakes')">⭐ 错题本与收藏库</button>
        <button class="tab-btn" onclick="switchTab('all')">📚 题库总览 (225题)</button>
    </div>

    <div id="quiz-view">
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-num" id="current-index-display">1/21</div>
                <div class="stat-label">套题进度（共21题：8单选+10判断+3案例设问）</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="suite-score-display">0</div>
                <div class="stat-label">本次套题得分</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="mistake-count-display">0</div>
                <div class="stat-label">错题库收录数</div>
            </div>
        </div>

        <div class="card" id="question-card">
            <div class="exam-header">
                <span class="badge" id="question-type-badge">单选题</span>
                <div>
                    <button class="btn btn-outline btn-fav" id="fav-btn" onclick="toggleFavorite()">⭐ 标记错题/收藏</button>
                    <button class="btn btn-outline" onclick="generateNewSuite()">🔄 生成新套题</button>
                </div>
            </div>

            <div id="case-context-box" class="case-box hidden">
                <strong style="color:var(--primary-color);">【案例案情背景】</strong>
                <p id="case-text" style="margin-top:6px;"></p>
            </div>

            <div class="question-title" id="question-text">题目加载中...</div>
            <div class="options-list" id="options-container"></div>

            <div class="explanation-box" id="explanation-box" style="display:none;">
                <div class="explanation-title" id="result-status"></div>
                <p id="explanation-text" style="font-size:0.95rem; line-height:1.6; color:var(--text-color);"></p>
            </div>

            <div class="controls">
                <span id="weight-tip" style="font-size: 0.88rem; color: var(--text-muted);"></span>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>下一题</button>
            </div>
        </div>

        <div class="card hidden" id="result-card">
            <div class="result-summary">
                <h2>🎉 本套测试完整结束！</h2>
                <div class="score-display" id="final-score">0 分</div>
                <p id="final-eval" style="margin-bottom: 20px; color: var(--text-color); font-size: 1.1rem;"></p>
                <p style="font-size: 0.92rem; color: var(--text-muted); margin-bottom: 25px;">
                    抽取机制说明：本次做错的题目已自动提高权重。下次抽取套题时，错题将自动增加被抽中的概率！
                </p>
                <button class="btn btn-primary" onclick="generateNewSuite()">抽取下一套题（8单选+10判断+1案例）</button>
            </div>
        </div>
    </div>

    <div id="mistakes-view" class="card hidden">
        <h2>高频错题与加权抽取库</h2>
        <div id="mistakes-list" style="margin-top:15px;"></div>
    </div>

    <div id="all-view" class="card hidden">
        <h2>题库总览（225题）</h2>
        <div id="all-questions-list" style="margin-top: 22px;"></div>
    </div>
</div>

<script>
const db = {"singles": [{"id": "s_1", "type": "single", "title": "1. 【考点：物权法定原则的边界】下列关于物权法定原则及其效力的表述，正确的是（ ）", "options": ["A. 当事人可以通过合同创设法律未规定的物权类型", "B. 违反物权法定原则的物权创设行为不产生物权效力，但合同本身可能有效", "C. 行政法规和地方性法规可以自由设定物权种类", "D. 习惯法在任何情况下均绝对不得作为物权创设的依据"], "answer": 1, "explain": "【法理分析】《民法典》第116条规定物权法定原则。物权种类和内容由法律规定，行政法规等不得创设物权；违反物权法定导致物权创设不生效，但不必然导致债权合同无效（区分原则）。"}, {"id": "s_2", "type": "single", "title": "2. 【考点：一物一权原则与物权客体】关于一物一权原则与物权客体特定原则，下列表述正确的是（ ）", "options": ["A. 一套房屋中的主卧可以单独设立所有权", "B. 正在建造中的建筑物在具备房屋雏形时可以成为物权的客体", "C. 集合物上只能设立一个所有权，不能设立多个物权", "D. 动产浮动抵押违反了一物一权原则，因其客体不确定"], "answer": 1, "explain": "【法理分析】正在建造的建筑物（在建工程）属于特定物，可以设立抵押权（第395条），符合一物一权与客体特定原则；房屋部分房间不能独立设立所有权。"}, {"id": "s_3", "type": "single", "title": "3. 【考点：物权与债权的效力对比】甲将画作卖给乙，后又将该画卖给丙并当场交付给丙。下列关于物权与债权效力的说法，正确的是（ ）", "options": ["A. 乙基于先签订的买卖合同享有优先于丙取得画作所有权的效力", "B. 丙基于现实交付取得画作所有权，体现了物权的对世性与优先效力", "C. 甲乙之间的买卖合同因侵犯丙的物权而无效", "D. 乙可以对丙主张物上请求权要求返还画作"], "answer": 1, "explain": "【法理分析】物权具有优先效力与排他性，动产交付后丙取得所有权。债权具有平等性，乙不能以先签订合同对抗丙取得的物权，只能要求甲承担违约责任。"}, {"id": "s_4", "type": "single", "title": "4. 【考点：物权公示与公信原则】关于物权的公示原则与公信原则，下列表述正确的是（ ）", "options": ["A. 公示原则旨在解决物权变动的外在表现，公信原则旨在保护对公示产生信赖的善意第三人", "B. 不动产登记簿记载错误时，真权利人绝对无法追回不动产", "C. 动产占有不具有公信力，仅不动产登记具有公信力", "D. 公示是物权变动的唯一必要要件，法律绝无例外"], "answer": 0, "explain": "【法理分析】公示原则解决物权变动的外部表征（登记或交付）；公信原则赋予公示以法律信任效力，保护善意第三人信赖利益。"}, {"id": "s_5", "type": "single", "title": "5. 【考点：区分原则（民法典第215条）】甲与乙签订房屋买卖合同，约定一个月后办理过户。次日房屋因不可抗力毁损。下列表述正确的是（ ）", "options": ["A. 房屋买卖合同因标的物灭失而自始无效", "B. 未办理过户登记不影响买卖合同的效力，合同自成立时生效", "C. 房屋所有权已随合同生效而转移给乙", "D. 乙可以要求登记机关直接补办过户"], "answer": 1, "explain": "【法理分析】《民法典》第215条区分原则：物权未变动不影响买卖合同效力。合同成立生效后，风险负担依据第604条交付原则确定。"}, {"id": "s_6", "type": "single", "title": "6. 【考点：物权行为独立性与无因性争议】在学理上，关于物权行为独立性与无因性，下列说法符合王泽鉴教授及通说观点的是（ ）", "options": ["A. 负担行为（债权行为）无效时，处分行为（物权行为）必然随之无效", "B. 物权行为独立性是指物权变动的法律行为独立于债权合同而存在", "C. 我国《民法典》完全否定了物权行为独立性理论", "D. 若承认物权行为无因性，当买卖合同被撤销时，出卖人可直接主张物上请求权返还原物"], "answer": 1, "explain": "【法理分析】物权行为独立性将物权变动的意思表示与债权合同分离。在无因性理论下，债权合同无效/被撤销时，物权变动仍有效，出卖人仅享有不当得利债权请求权（而非物上请求权）。"}, {"id": "s_7", "type": "single", "title": "7. 【考点：占有改定与物权变动】甲将木材卖给乙，双方约定甲留用该木材3个月。这种交付形态属于（ ）", "options": ["A. 现实交付", "B. 简易交付", "C. 指示交付", "D. 占有改定"], "answer": 3, "explain": "【法理分析】《民法典》第228条规定，动产物权转让时，双方约定由转让人继续占有该动产的，物权自约定生效时发生效力，即占有改定。"}, {"id": "s_8", "type": "single", "title": "8. 【考点：指示交付的法律要件】甲将寄存在乙仓库的货物卖给丙，甲将其对乙的返还请求权让与丙，并通知乙。此交付形态为（ ）", "options": ["A. 简易交付", "B. 指示交付", "C. 占有改定", "D. 拟制交付"], "answer": 1, "explain": "【法理分析】《民法典》第227条，动产物权设立和转让前，第三人依法占有该动产的，负有交付义务的人可以通过转让请求第三人返还原物的权利代替交付，即指示交付。"}, {"id": "s_9", "type": "single", "title": "9. 【考点：简易交付的生效时点】乙已租用甲的摄影器材，租赁期间乙决定购买该器材，双方于5月1日达成买卖合意。物权变动生效时间为（ ）", "options": ["A. 租赁合同签订时", "B. 5月1日买卖合意生效时", "C. 乙付清价款时", "D. 租赁期限届满时"], "answer": 1, "explain": "【法理分析】《民法典》第226条简易交付：动产物权设立和转让前，权利人已经占有该动产的，物权自买卖合意生效时发生效力。"}, {"id": "s_10", "type": "single", "title": "10. 【考点：不动产预告登记效力】甲将新房卖给乙并办理了预告登记。后甲未经乙同意将该房抵押给丙。下列表述正确的是（ ）", "options": ["A. 丙取得不动产抵押权", "B. 预告登记产生物权封锁效力，甲的抵押行为不发生物权效力", "C. 乙的预告登记自动转为正式所有权登记", "D. 甲丙之间的抵押合同无效"], "answer": 1, "explain": "【法理分析】《民法典》第221条，预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力。"}, {"id": "s_11", "type": "single", "title": "11. 【考点：法院判决引致的非依法律行为物权变动】因人民法院分割共有财产的形成判决，物权变动的生效时点为（ ）", "options": ["A. 判决书生效时", "B. 办理变更登记时", "C. 实际交付财产时", "D. 申请执行时"], "answer": 0, "explain": "【法理分析】《民法典》第229条，因人民法院、仲裁机构的法律文书等，导致物权设立、变更、转让或者消灭的，自法律文书生效时发生效力。"}, {"id": "s_12", "type": "single", "title": "12. 【考点：合法建造引发的物权变动】甲未经批准在自家院内建造房屋。建造完成后，该房屋物权变动的状态是（ ）", "options": ["A. 自办理房屋登记时取得所有权", "B. 因违法建造不能取得所有权，但建造事实成就时取得占有保护", "C. 自事实行为成就时直接取得完整不动产所有权", "D. 属于国家所有"], "answer": 1, "explain": "【法理分析】违法建筑因违反行政强制性规范不能办理产权登记取得法定所有权，但建造人对其享有占有事实，受占有保护规则保护（第462条）。"}, {"id": "s_13", "type": "single", "title": "13. 【考点：继承引发的物权变动】被继承人甲死亡，继承人乙未办理房屋过户登记即公开出租该房屋。乙对房屋的物权状态为（ ）", "options": ["A. 未登记故未取得所有权", "B. 自继承开始时已取得所有权，但未经登记处分（处分行为）受限制", "C. 租赁合同因未登记而无效", "D. 属于无权占有"], "answer": 1, "explain": "【法理分析】《民法典》第230条继承自继承开始时取得物权；第232条规定非依法律行为享有的不动产物权，未经登记处分的，不发生物权效力（但不影响租赁等债权行为效力）。"}, {"id": "s_14", "type": "single", "title": "14. 【考点：添附——加工人所有权归属】甲将价值100元的木材交给乙，乙未经同意将其雕刻成价值5万元的艺术品。关于所有权归属，下列表述符合通说的是（ ）", "options": ["A. 归甲所有，甲不需给乙任何补偿", "B. 若乙为善意，可因加工价值远大于材料价值取得所有权并补偿甲；若乙系恶意侵权，产权仍归甲", "C. 一律归乙所有，乙补偿甲100元", "D. 归国家所有"], "answer": 1, "explain": "【法理分析】《民法典》第322条添附规则：加工物产权原则上归材料人或加工价值远大于材料价值的加工人，但恶意加工人不得因违法行为获利，应保障无过错方权益。"}, {"id": "s_15", "type": "single", "title": "15. 【考点：添附——附合与混合】甲将乙的油漆刷在自己房屋的外墙上，该油漆发生的物权变动形态属于（ ）", "options": ["A. 动产与动产的混合", "B. 动产与不动产的附合，房屋所有权人甲取得油漆所有权", "C. 加工", "D. 简易交付"], "answer": 1, "explain": "【法理分析】动产（油漆）附合于不动产（房屋），无法分离或分离费用过高，由不动产所有权人取得附合物所有权，并对动产所有权人进行补偿。"}, {"id": "s_16", "type": "single", "title": "16. 【考点：善意取得五要件】下列情形中，受让人可以主张构成善意取得的是（ ）", "options": ["A. 甲将租来的汽车以远低于市场价的价格卖给知情的乙", "B. 甲将代为保管的画作以合理市场价卖给善意丙，并已现实交付", "C. 甲将盗窃来的金项链卖给善意的丁，丁已支付合理价款", "D. 甲将房屋卖给戊，戊明知甲非登记所有权人"], "answer": 1, "explain": "【法理分析】《民法典》第311条善意取得要件：无权处分人转让、受让人受让时善意、合理价格、已完成交付或登记。B选项完全符合。"}, {"id": "s_17", "type": "single", "title": "17. 【考点：善意取得与占有改定争议】甲将画作卖给乙，约定甲继续借用（占有改定）。甲随后又将该画卖给不知情的丙，亦约定占有改定。丙能否主张善意取得？（ ）", "options": ["A. 能，占有改定属于合法交付方式", "B. 不能，占有改定未完成现实占有的移转，受让人未获得公信外观", "C. 能，因为丙支付了合理价格", "D. 能，因为甲丙合同有效"], "answer": 1, "explain": "【法理分析】通说与《最高人民法院关于适用〈民法典〉物权编的解释（一）》第17条排除占有改定作为善意取得的即时交付方式，因受让人未取得占有公信外观。"}, {"id": "s_18", "type": "single", "title": "18. 【考点：脱手物与盗赃物/遗失物追回】甲的项链被偷，小偷乙卖给不知情的丙。甲发现后请求丙返还。下列表述正确的是（ ）", "options": ["A. 丙已经善意取得项链所有权，甲无权追回", "B. 甲有权自知道或应当知道受让人丙之日起2年内请求丙返还原物", "C. 甲只能要求小偷赔偿，不能向丙追回", "D. 丙可以永久拒绝返还"], "answer": 1, "explain": "【法理分析】《民法典》第312条遗失物/盗赃物等脱手物原则上不适用善意取得。所有权人有权自知道或应当知道受让人之日起2年内请求返还原物。"}, {"id": "s_19", "type": "single", "title": "19. 【考点：有偿拍卖/公开市场购得遗失物之补偿】甲遗失的手表被乙拾得后在公开拍卖会上卖给不知情的丙。甲向丙请求返还手表时，下列表述正确的是（ ）", "options": ["A. 甲无权请求返还", "B. 甲请求返还时，应当支付丙购买该手表的费用", "C. 丙可以拒绝返还并要求取得所有权", "D. 甲只需向乙追偿，不能向丙主张"], "answer": 1, "explain": "【法理分析】《民法典》第312条后半段：受让人通过拍卖或者向具有经营资格的经营者购得该遗失物的，权利人请求返还原物时应当支付受让人所付的费用。"}, {"id": "s_20", "type": "single", "title": "20. 【考点：诈骗物与委托物（脱手物 vs 非脱手物）】甲被诈骗将名画交付给乙，乙将画卖给善意的丙并完成交付。丙能否取得所有权？（ ）", "options": ["A. 不能，诈骗物属于脱手物", "B. 能，诈骗系基于受害人意思交付，属于委托物（非脱手物），丙可依据第311条善意取得", "C. 不能，因为乙构成刑事犯罪", "D. 能，但甲可以在2年内追回"], "answer": 1, "explain": "【法理分析】因欺诈、胁迫而交付的财产属于“占有委托物”（非脱手物），因原所有权人系自愿交付占有，善意受让人可依据第311条取得所有权。"}, {"id": "s_21", "type": "single", "title": "21. 【考点：返还原物请求权之相对人】甲的机器被乙盗窃，乙将机器出租给不知情的丙使用。甲主张返还原物请求权，相对人应为（ ）", "options": ["A. 仅能是乙", "B. 丙作为直接无权占有人，甲可对其主张返还原物请求权", "C. 只能是丙，乙不再承担任何责任", "D. 甲不能主张物上请求权"], "answer": 1, "explain": "【法理分析】《民法典》第235条返还原物请求权的相对人为现时的无权占有人（包括直接占有人丙和间接占有人乙）。"}, {"id": "s_22", "type": "single", "title": "22. 【考点：物上请求权与诉讼时效（民法典第196条）】下列物权请求权中，适用3年诉讼时效规定的是（ ）", "options": ["A. 不动产物权人请求无权占有人返还原物", "B. 登记的动产物权人请求无权占有人返还原物", "C. 未登记的动产物权人请求无权占有人返还原物", "D. 物权人请求排除妨害、消除危险"], "answer": 2, "explain": "【法理分析】《民法典》第196条：不动产物权和登记的动产物权人请求返还原物不适用诉讼时效；未登记的动产物权人请求返还原物适用诉讼时效。"}, {"id": "s_23", "type": "single", "title": "23. 【考点：物上请求权与归责要件】乙在甲的土地上堆放渣土，妨害甲的使用，但乙主张自己无过错。甲请求乙清除渣土（排除妨害），下列表述正确的是（ ）", "options": ["A. 排除妨害请求权以乙主观上有过错为要件", "B. 排除妨害请求权不以乙主观过错为要件，只要存在客观妨害即可", "C. 甲必须证明自己遭受了实际财产损失", "D. 甲只能主张侵权损害赔偿"], "answer": 1, "explain": "【法理分析】物上请求权（排除妨害、消除危险、返还原物）系物权圆满状态受干涉时的防御性请求权，不以相对人主观过错和实际损害为要件。"}, {"id": "s_24", "type": "single", "title": "24. 【考点：无权占有人与所有权人间的费用返还（民法典第460条）】善意占有人乙占有甲的房屋期间，支出必要维修费5000元，支出改装豪华灯具费10000元。甲请求乙返还房屋时，费用补偿规则为（ ）", "options": ["A. 乙有权请求甲支付必要修理费5000元，但无权强求甲支付有益费用（改装费）", "B. 乙有权请求甲支付15000元全部费用", "C. 善意占有人无权请求任何费用返还", "D. 仅恶意占有人有权请求必要费用"], "answer": 0, "explain": "【法理分析】《民法典》第460条：不动产或者动产被占有的，权利人可以请求返还原物及其孳息；占有人因维护该不动产或者动产支出的必要费用，有权请求权利人支付（善意占有人享有必要费用返还请求权）。"}, {"id": "s_25", "type": "single", "title": "25. 【考点：恶意占有人与孳息返还（民法典第459-460条）】恶意占有人乙明知房屋属于甲而强行占有并出租，收取租金5万元。甲请求返还时（ ）", "options": ["A. 乙可保留全部租金", "B. 乙应当返还房屋及收取的5万元孳息（租金），且无权请求必要费用", "C. 乙只需返还房屋，租金属于劳动所得", "D. 乙可以扣除维修费后返还剩余租金"], "answer": 1, "explain": "【法理分析】《民法典》第459条、460条：恶意占有人应对占有物毁损灭失承担赔偿责任，应当返还原物及其孳息（租金为法定孳息），且无权请求必要的维护费用。"}, {"id": "s_26", "type": "single", "title": "26. 【考点：物权法定原则的边界】下列关于物权法定原则及其效力的表述，正确的是（ ）", "options": ["A. 当事人可以通过合同创设法律未规定的物权类型", "B. 违反物权法定原则的物权创设行为不产生物权效力，但合同本身可能有效", "C. 行政法规和地方性法规可以自由设定物权种类", "D. 习惯法在任何情况下均绝对不得作为物权创设的依据"], "answer": 1, "explain": "【法理分析】《民法典》第116条规定物权法定原则。物权种类和内容由法律规定，行政法规等不得创设物权；违反物权法定导致物权创设不生效，但不必然导致债权合同无效（区分原则）。"}, {"id": "s_27", "type": "single", "title": "27. 【考点：一物一权原则与物权客体】关于一物一权原则与物权客体特定原则，下列表述正确的是（ ）", "options": ["A. 一套房屋中的主卧可以单独设立所有权", "B. 正在建造中的建筑物在具备房屋雏形时可以成为物权的客体", "C. 集合物上只能设立一个所有权，不能设立多个物权", "D. 动产浮动抵押违反了一物一权原则，因其客体不确定"], "answer": 1, "explain": "【法理分析】正在建造的建筑物（在建工程）属于特定物，可以设立抵押权（第395条），符合一物一权与客体特定原则；房屋部分房间不能独立设立所有权。"}, {"id": "s_28", "type": "single", "title": "28. 【考点：物权与债权的效力对比】甲将画作卖给乙，后又将该画卖给丙并当场交付给丙。下列关于物权与债权效力的说法，正确的是（ ）", "options": ["A. 乙基于先签订的买卖合同享有优先于丙取得画作所有权的效力", "B. 丙基于现实交付取得画作所有权，体现了物权的对世性与优先效力", "C. 甲乙之间的买卖合同因侵犯丙的物权而无效", "D. 乙可以对丙主张物上请求权要求返还画作"], "answer": 1, "explain": "【法理分析】物权具有优先效力与排他性，动产交付后丙取得所有权。债权具有平等性，乙不能以先签订合同对抗丙取得的物权，只能要求甲承担违约责任。"}, {"id": "s_29", "type": "single", "title": "29. 【考点：物权公示与公信原则】关于物权的公示原则与公信原则，下列表述正确的是（ ）", "options": ["A. 公示原则旨在解决物权变动的外在表现，公信原则旨在保护对公示产生信赖的善意第三人", "B. 不动产登记簿记载错误时，真权利人绝对无法追回不动产", "C. 动产占有不具有公信力，仅不动产登记具有公信力", "D. 公示是物权变动的唯一必要要件，法律绝无例外"], "answer": 0, "explain": "【法理分析】公示原则解决物权变动的外部表征（登记或交付）；公信原则赋予公示以法律信任效力，保护善意第三人信赖利益。"}, {"id": "s_30", "type": "single", "title": "30. 【考点：区分原则（民法典第215条）】甲与乙签订房屋买卖合同，约定一个月后办理过户。次日房屋因不可抗力毁损。下列表述正确的是（ ）", "options": ["A. 房屋买卖合同因标的物灭失而自始无效", "B. 未办理过户登记不影响买卖合同的效力，合同自成立时生效", "C. 房屋所有权已随合同生效而转移给乙", "D. 乙可以要求登记机关直接补办过户"], "answer": 1, "explain": "【法理分析】《民法典》第215条区分原则：物权未变动不影响买卖合同效力。合同成立生效后，风险负担依据第604条交付原则确定。"}, {"id": "s_31", "type": "single", "title": "31. 【考点：物权行为独立性与无因性争议】在学理上，关于物权行为独立性与无因性，下列说法符合王泽鉴教授及通说观点的是（ ）", "options": ["A. 负担行为（债权行为）无效时，处分行为（物权行为）必然随之无效", "B. 物权行为独立性是指物权变动的法律行为独立于债权合同而存在", "C. 我国《民法典》完全否定了物权行为独立性理论", "D. 若承认物权行为无因性，当买卖合同被撤销时，出卖人可直接主张物上请求权返还原物"], "answer": 1, "explain": "【法理分析】物权行为独立性将物权变动的意思表示与债权合同分离。在无因性理论下，债权合同无效/被撤销时，物权变动仍有效，出卖人仅享有不当得利债权请求权（而非物上请求权）。"}, {"id": "s_32", "type": "single", "title": "32. 【考点：占有改定与物权变动】甲将木材卖给乙，双方约定甲留用该木材3个月。这种交付形态属于（ ）", "options": ["A. 现实交付", "B. 简易交付", "C. 指示交付", "D. 占有改定"], "answer": 3, "explain": "【法理分析】《民法典》第228条规定，动产物权转让时，双方约定由转让人继续占有该动产的，物权自约定生效时发生效力，即占有改定。"}, {"id": "s_33", "type": "single", "title": "33. 【考点：指示交付的法律要件】甲将寄存在乙仓库的货物卖给丙，甲将其对乙的返还请求权让与丙，并通知乙。此交付形态为（ ）", "options": ["A. 简易交付", "B. 指示交付", "C. 占有改定", "D. 拟制交付"], "answer": 1, "explain": "【法理分析】《民法典》第227条，动产物权设立和转让前，第三人依法占有该动产的，负有交付义务的人可以通过转让请求第三人返还原物的权利代替交付，即指示交付。"}, {"id": "s_34", "type": "single", "title": "34. 【考点：简易交付的生效时点】乙已租用甲的摄影器材，租赁期间乙决定购买该器材，双方于5月1日达成买卖合意。物权变动生效时间为（ ）", "options": ["A. 租赁合同签订时", "B. 5月1日买卖合意生效时", "C. 乙付清价款时", "D. 租赁期限届满时"], "answer": 1, "explain": "【法理分析】《民法典》第226条简易交付：动产物权设立和转让前，权利人已经占有该动产的，物权自买卖合意生效时发生效力。"}, {"id": "s_35", "type": "single", "title": "35. 【考点：不动产预告登记效力】甲将新房卖给乙并办理了预告登记。后甲未经乙同意将该房抵押给丙。下列表述正确的是（ ）", "options": ["A. 丙取得不动产抵押权", "B. 预告登记产生物权封锁效力，甲的抵押行为不发生物权效力", "C. 乙的预告登记自动转为正式所有权登记", "D. 甲丙之间的抵押合同无效"], "answer": 1, "explain": "【法理分析】《民法典》第221条，预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力。"}, {"id": "s_36", "type": "single", "title": "36. 【考点：法院判决引致的非依法律行为物权变动】因人民法院分割共有财产的形成判决，物权变动的生效时点为（ ）", "options": ["A. 判决书生效时", "B. 办理变更登记时", "C. 实际交付财产时", "D. 申请执行时"], "answer": 0, "explain": "【法理分析】《民法典》第229条，因人民法院、仲裁机构的法律文书等，导致物权设立、变更、转让或者消灭的，自法律文书生效时发生效力。"}, {"id": "s_37", "type": "single", "title": "37. 【考点：合法建造引发的物权变动】甲未经批准在自家院内建造房屋。建造完成后，该房屋物权变动的状态是（ ）", "options": ["A. 自办理房屋登记时取得所有权", "B. 因违法建造不能取得所有权，但建造事实成就时取得占有保护", "C. 自事实行为成就时直接取得完整不动产所有权", "D. 属于国家所有"], "answer": 1, "explain": "【法理分析】违法建筑因违反行政强制性规范不能办理产权登记取得法定所有权，但建造人对其享有占有事实，受占有保护规则保护（第462条）。"}, {"id": "s_38", "type": "single", "title": "38. 【考点：继承引发的物权变动】被继承人甲死亡，继承人乙未办理房屋过户登记即公开出租该房屋。乙对房屋的物权状态为（ ）", "options": ["A. 未登记故未取得所有权", "B. 自继承开始时已取得所有权，但未经登记处分（处分行为）受限制", "C. 租赁合同因未登记而无效", "D. 属于无权占有"], "answer": 1, "explain": "【法理分析】《民法典》第230条继承自继承开始时取得物权；第232条规定非依法律行为享有的不动产物权，未经登记处分的，不发生物权效力（但不影响租赁等债权行为效力）。"}, {"id": "s_39", "type": "single", "title": "39. 【考点：添附——加工人所有权归属】甲将价值100元的木材交给乙，乙未经同意将其雕刻成价值5万元的艺术品。关于所有权归属，下列表述符合通说的是（ ）", "options": ["A. 归甲所有，甲不需给乙任何补偿", "B. 若乙为善意，可因加工价值远大于材料价值取得所有权并补偿甲；若乙系恶意侵权，产权仍归甲", "C. 一律归乙所有，乙补偿甲100元", "D. 归国家所有"], "answer": 1, "explain": "【法理分析】《民法典》第322条添附规则：加工物产权原则上归材料人或加工价值远大于材料价值的加工人，但恶意加工人不得因违法行为获利，应保障无过错方权益。"}, {"id": "s_40", "type": "single", "title": "40. 【考点：添附——附合与混合】甲将乙的油漆刷在自己房屋的外墙上，该油漆发生的物权变动形态属于（ ）", "options": ["A. 动产与动产的混合", "B. 动产与不动产的附合，房屋所有权人甲取得油漆所有权", "C. 加工", "D. 简易交付"], "answer": 1, "explain": "【法理分析】动产（油漆）附合于不动产（房屋），无法分离或分离费用过高，由不动产所有权人取得附合物所有权，并对动产所有权人进行补偿。"}, {"id": "s_41", "type": "single", "title": "41. 【考点：善意取得五要件】下列情形中，受让人可以主张构成善意取得的是（ ）", "options": ["A. 甲将租来的汽车以远低于市场价的价格卖给知情的乙", "B. 甲将代为保管的画作以合理市场价卖给善意丙，并已现实交付", "C. 甲将盗窃来的金项链卖给善意的丁，丁已支付合理价款", "D. 甲将房屋卖给戊，戊明知甲非登记所有权人"], "answer": 1, "explain": "【法理分析】《民法典》第311条善意取得要件：无权处分人转让、受让人受让时善意、合理价格、已完成交付或登记。B选项完全符合。"}, {"id": "s_42", "type": "single", "title": "42. 【考点：善意取得与占有改定争议】甲将画作卖给乙，约定甲继续借用（占有改定）。甲随后又将该画卖给不知情的丙，亦约定占有改定。丙能否主张善意取得？（ ）", "options": ["A. 能，占有改定属于合法交付方式", "B. 不能，占有改定未完成现实占有的移转，受让人未获得公信外观", "C. 能，因为丙支付了合理价格", "D. 能，因为甲丙合同有效"], "answer": 1, "explain": "【法理分析】通说与《最高人民法院关于适用〈民法典〉物权编的解释（一）》第17条排除占有改定作为善意取得的即时交付方式，因受让人未取得占有公信外观。"}, {"id": "s_43", "type": "single", "title": "43. 【考点：脱手物与盗赃物/遗失物追回】甲的项链被偷，小偷乙卖给不知情的丙。甲发现后请求丙返还。下列表述正确的是（ ）", "options": ["A. 丙已经善意取得项链所有权，甲无权追回", "B. 甲有权自知道或应当知道受让人丙之日起2年内请求丙返还原物", "C. 甲只能要求小偷赔偿，不能向丙追回", "D. 丙可以永久拒绝返还"], "answer": 1, "explain": "【法理分析】《民法典》第312条遗失物/盗赃物等脱手物原则上不适用善意取得。所有权人有权自知道或应当知道受让人之日起2年内请求返还原物。"}, {"id": "s_44", "type": "single", "title": "44. 【考点：有偿拍卖/公开市场购得遗失物之补偿】甲遗失的手表被乙拾得后在公开拍卖会上卖给不知情的丙。甲向丙请求返还手表时，下列表述正确的是（ ）", "options": ["A. 甲无权请求返还", "B. 甲请求返还时，应当支付丙购买该手表的费用", "C. 丙可以拒绝返还并要求取得所有权", "D. 甲只需向乙追偿，不能向丙主张"], "answer": 1, "explain": "【法理分析】《民法典》第312条后半段：受让人通过拍卖或者向具有经营资格的经营者购得该遗失物的，权利人请求返还原物时应当支付受让人所付的费用。"}, {"id": "s_45", "type": "single", "title": "45. 【考点：诈骗物与委托物（脱手物 vs 非脱手物）】甲被诈骗将名画交付给乙，乙将画卖给善意的丙并完成交付。丙能否取得所有权？（ ）", "options": ["A. 不能，诈骗物属于脱手物", "B. 能，诈骗系基于受害人意思交付，属于委托物（非脱手物），丙可依据第311条善意取得", "C. 不能，因为乙构成刑事犯罪", "D. 能，但甲可以在2年内追回"], "answer": 1, "explain": "【法理分析】因欺诈、胁迫而交付的财产属于“占有委托物”（非脱手物），因原所有权人系自愿交付占有，善意受让人可依据第311条取得所有权。"}, {"id": "s_46", "type": "single", "title": "46. 【考点：返还原物请求权之相对人】甲的机器被乙盗窃，乙将机器出租给不知情的丙使用。甲主张返还原物请求权，相对人应为（ ）", "options": ["A. 仅能是乙", "B. 丙作为直接无权占有人，甲可对其主张返还原物请求权", "C. 只能是丙，乙不再承担任何责任", "D. 甲不能主张物上请求权"], "answer": 1, "explain": "【法理分析】《民法典》第235条返还原物请求权的相对人为现时的无权占有人（包括直接占有人丙和间接占有人乙）。"}, {"id": "s_47", "type": "single", "title": "47. 【考点：物上请求权与诉讼时效（民法典第196条）】下列物权请求权中，适用3年诉讼时效规定的是（ ）", "options": ["A. 不动产物权人请求无权占有人返还原物", "B. 登记的动产物权人请求无权占有人返还原物", "C. 未登记的动产物权人请求无权占有人返还原物", "D. 物权人请求排除妨害、消除危险"], "answer": 2, "explain": "【法理分析】《民法典》第196条：不动产物权和登记的动产物权人请求返还原物不适用诉讼时效；未登记的动产物权人请求返还原物适用诉讼时效。"}, {"id": "s_48", "type": "single", "title": "48. 【考点：物上请求权与归责要件】乙在甲的土地上堆放渣土，妨害甲的使用，但乙主张自己无过错。甲请求乙清除渣土（排除妨害），下列表述正确的是（ ）", "options": ["A. 排除妨害请求权以乙主观上有过错为要件", "B. 排除妨害请求权不以乙主观过错为要件，只要存在客观妨害即可", "C. 甲必须证明自己遭受了实际财产损失", "D. 甲只能主张侵权损害赔偿"], "answer": 1, "explain": "【法理分析】物上请求权（排除妨害、消除危险、返还原物）系物权圆满状态受干涉时的防御性请求权，不以相对人主观过错和实际损害为要件。"}, {"id": "s_49", "type": "single", "title": "49. 【考点：无权占有人与所有权人间的费用返还（民法典第460条）】善意占有人乙占有甲的房屋期间，支出必要维修费5000元，支出改装豪华灯具费10000元。甲请求乙返还房屋时，费用补偿规则为（ ）", "options": ["A. 乙有权请求甲支付必要修理费5000元，但无权强求甲支付有益费用（改装费）", "B. 乙有权请求甲支付15000元全部费用", "C. 善意占有人无权请求任何费用返还", "D. 仅恶意占有人有权请求必要费用"], "answer": 0, "explain": "【法理分析】《民法典》第460条：不动产或者动产被占有的，权利人可以请求返还原物及其孳息；占有人因维护该不动产或者动产支出的必要费用，有权请求权利人支付（善意占有人享有必要费用返还请求权）。"}, {"id": "s_50", "type": "single", "title": "50. 【考点：恶意占有人与孳息返还（民法典第459-460条）】恶意占有人乙明知房屋属于甲而强行占有并出租，收取租金5万元。甲请求返还时（ ）", "options": ["A. 乙可保留全部租金", "B. 乙应当返还房屋及收取的5万元孳息（租金），且无权请求必要费用", "C. 乙只需返还房屋，租金属于劳动所得", "D. 乙可以扣除维修费后返还剩余租金"], "answer": 1, "explain": "【法理分析】《民法典》第459条、460条：恶意占有人应对占有物毁损灭失承担赔偿责任，应当返还原物及其孳息（租金为法定孳息），且无权请求必要的维护费用。"}, {"id": "s_51", "type": "single", "title": "51. 【考点：物权法定原则的边界】下列关于物权法定原则及其效力的表述，正确的是（ ）", "options": ["A. 当事人可以通过合同创设法律未规定的物权类型", "B. 违反物权法定原则的物权创设行为不产生物权效力，但合同本身可能有效", "C. 行政法规和地方性法规可以自由设定物权种类", "D. 习惯法在任何情况下均绝对不得作为物权创设的依据"], "answer": 1, "explain": "【法理分析】《民法典》第116条规定物权法定原则。物权种类和内容由法律规定，行政法规等不得创设物权；违反物权法定导致物权创设不生效，但不必然导致债权合同无效（区分原则）。"}, {"id": "s_52", "type": "single", "title": "52. 【考点：一物一权原则与物权客体】关于一物一权原则与物权客体特定原则，下列表述正确的是（ ）", "options": ["A. 一套房屋中的主卧可以单独设立所有权", "B. 正在建造中的建筑物在具备房屋雏形时可以成为物权的客体", "C. 集合物上只能设立一个所有权，不能设立多个物权", "D. 动产浮动抵押违反了一物一权原则，因其客体不确定"], "answer": 1, "explain": "【法理分析】正在建造的建筑物（在建工程）属于特定物，可以设立抵押权（第395条），符合一物一权与客体特定原则；房屋部分房间不能独立设立所有权。"}, {"id": "s_53", "type": "single", "title": "53. 【考点：物权与债权的效力对比】甲将画作卖给乙，后又将该画卖给丙并当场交付给丙。下列关于物权与债权效力的说法，正确的是（ ）", "options": ["A. 乙基于先签订的买卖合同享有优先于丙取得画作所有权的效力", "B. 丙基于现实交付取得画作所有权，体现了物权的对世性与优先效力", "C. 甲乙之间的买卖合同因侵犯丙的物权而无效", "D. 乙可以对丙主张物上请求权要求返还画作"], "answer": 1, "explain": "【法理分析】物权具有优先效力与排他性，动产交付后丙取得所有权。债权具有平等性，乙不能以先签订合同对抗丙取得的物权，只能要求甲承担违约责任。"}, {"id": "s_54", "type": "single", "title": "54. 【考点：物权公示与公信原则】关于物权的公示原则与公信原则，下列表述正确的是（ ）", "options": ["A. 公示原则旨在解决物权变动的外在表现，公信原则旨在保护对公示产生信赖的善意第三人", "B. 不动产登记簿记载错误时，真权利人绝对无法追回不动产", "C. 动产占有不具有公信力，仅不动产登记具有公信力", "D. 公示是物权变动的唯一必要要件，法律绝无例外"], "answer": 0, "explain": "【法理分析】公示原则解决物权变动的外部表征（登记或交付）；公信原则赋予公示以法律信任效力，保护善意第三人信赖利益。"}, {"id": "s_55", "type": "single", "title": "55. 【考点：区分原则（民法典第215条）】甲与乙签订房屋买卖合同，约定一个月后办理过户。次日房屋因不可抗力毁损。下列表述正确的是（ ）", "options": ["A. 房屋买卖合同因标的物灭失而自始无效", "B. 未办理过户登记不影响买卖合同的效力，合同自成立时生效", "C. 房屋所有权已随合同生效而转移给乙", "D. 乙可以要求登记机关直接补办过户"], "answer": 1, "explain": "【法理分析】《民法典》第215条区分原则：物权未变动不影响买卖合同效力。合同成立生效后，风险负担依据第604条交付原则确定。"}, {"id": "s_56", "type": "single", "title": "56. 【考点：物权行为独立性与无因性争议】在学理上，关于物权行为独立性与无因性，下列说法符合王泽鉴教授及通说观点的是（ ）", "options": ["A. 负担行为（债权行为）无效时，处分行为（物权行为）必然随之无效", "B. 物权行为独立性是指物权变动的法律行为独立于债权合同而存在", "C. 我国《民法典》完全否定了物权行为独立性理论", "D. 若承认物权行为无因性，当买卖合同被撤销时，出卖人可直接主张物上请求权返还原物"], "answer": 1, "explain": "【法理分析】物权行为独立性将物权变动的意思表示与债权合同分离。在无因性理论下，债权合同无效/被撤销时，物权变动仍有效，出卖人仅享有不当得利债权请求权（而非物上请求权）。"}, {"id": "s_57", "type": "single", "title": "57. 【考点：占有改定与物权变动】甲将木材卖给乙，双方约定甲留用该木材3个月。这种交付形态属于（ ）", "options": ["A. 现实交付", "B. 简易交付", "C. 指示交付", "D. 占有改定"], "answer": 3, "explain": "【法理分析】《民法典》第228条规定，动产物权转让时，双方约定由转让人继续占有该动产的，物权自约定生效时发生效力，即占有改定。"}, {"id": "s_58", "type": "single", "title": "58. 【考点：指示交付的法律要件】甲将寄存在乙仓库的货物卖给丙，甲将其对乙的返还请求权让与丙，并通知乙。此交付形态为（ ）", "options": ["A. 简易交付", "B. 指示交付", "C. 占有改定", "D. 拟制交付"], "answer": 1, "explain": "【法理分析】《民法典》第227条，动产物权设立和转让前，第三人依法占有该动产的，负有交付义务的人可以通过转让请求第三人返还原物的权利代替交付，即指示交付。"}, {"id": "s_59", "type": "single", "title": "59. 【考点：简易交付的生效时点】乙已租用甲的摄影器材，租赁期间乙决定购买该器材，双方于5月1日达成买卖合意。物权变动生效时间为（ ）", "options": ["A. 租赁合同签订时", "B. 5月1日买卖合意生效时", "C. 乙付清价款时", "D. 租赁期限届满时"], "answer": 1, "explain": "【法理分析】《民法典》第226条简易交付：动产物权设立和转让前，权利人已经占有该动产的，物权自买卖合意生效时发生效力。"}, {"id": "s_60", "type": "single", "title": "60. 【考点：不动产预告登记效力】甲将新房卖给乙并办理了预告登记。后甲未经乙同意将该房抵押给丙。下列表述正确的是（ ）", "options": ["A. 丙取得不动产抵押权", "B. 预告登记产生物权封锁效力，甲的抵押行为不发生物权效力", "C. 乙的预告登记自动转为正式所有权登记", "D. 甲丙之间的抵押合同无效"], "answer": 1, "explain": "【法理分析】《民法典》第221条，预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力。"}, {"id": "s_61", "type": "single", "title": "61. 【考点：法院判决引致的非依法律行为物权变动】因人民法院分割共有财产的形成判决，物权变动的生效时点为（ ）", "options": ["A. 判决书生效时", "B. 办理变更登记时", "C. 实际交付财产时", "D. 申请执行时"], "answer": 0, "explain": "【法理分析】《民法典》第229条，因人民法院、仲裁机构的法律文书等，导致物权设立、变更、转让或者消灭的，自法律文书生效时发生效力。"}, {"id": "s_62", "type": "single", "title": "62. 【考点：合法建造引发的物权变动】甲未经批准在自家院内建造房屋。建造完成后，该房屋物权变动的状态是（ ）", "options": ["A. 自办理房屋登记时取得所有权", "B. 因违法建造不能取得所有权，但建造事实成就时取得占有保护", "C. 自事实行为成就时直接取得完整不动产所有权", "D. 属于国家所有"], "answer": 1, "explain": "【法理分析】违法建筑因违反行政强制性规范不能办理产权登记取得法定所有权，但建造人对其享有占有事实，受占有保护规则保护（第462条）。"}, {"id": "s_63", "type": "single", "title": "63. 【考点：继承引发的物权变动】被继承人甲死亡，继承人乙未办理房屋过户登记即公开出租该房屋。乙对房屋的物权状态为（ ）", "options": ["A. 未登记故未取得所有权", "B. 自继承开始时已取得所有权，但未经登记处分（处分行为）受限制", "C. 租赁合同因未登记而无效", "D. 属于无权占有"], "answer": 1, "explain": "【法理分析】《民法典》第230条继承自继承开始时取得物权；第232条规定非依法律行为享有的不动产物权，未经登记处分的，不发生物权效力（但不影响租赁等债权行为效力）。"}, {"id": "s_64", "type": "single", "title": "64. 【考点：添附——加工人所有权归属】甲将价值100元的木材交给乙，乙未经同意将其雕刻成价值5万元的艺术品。关于所有权归属，下列表述符合通说的是（ ）", "options": ["A. 归甲所有，甲不需给乙任何补偿", "B. 若乙为善意，可因加工价值远大于材料价值取得所有权并补偿甲；若乙系恶意侵权，产权仍归甲", "C. 一律归乙所有，乙补偿甲100元", "D. 归国家所有"], "answer": 1, "explain": "【法理分析】《民法典》第322条添附规则：加工物产权原则上归材料人或加工价值远大于材料价值的加工人，但恶意加工人不得因违法行为获利，应保障无过错方权益。"}, {"id": "s_65", "type": "single", "title": "65. 【考点：添附——附合与混合】甲将乙的油漆刷在自己房屋的外墙上，该油漆发生的物权变动形态属于（ ）", "options": ["A. 动产与动产的混合", "B. 动产与不动产的附合，房屋所有权人甲取得油漆所有权", "C. 加工", "D. 简易交付"], "answer": 1, "explain": "【法理分析】动产（油漆）附合于不动产（房屋），无法分离或分离费用过高，由不动产所有权人取得附合物所有权，并对动产所有权人进行补偿。"}, {"id": "s_66", "type": "single", "title": "66. 【考点：善意取得五要件】下列情形中，受让人可以主张构成善意取得的是（ ）", "options": ["A. 甲将租来的汽车以远低于市场价的价格卖给知情的乙", "B. 甲将代为保管的画作以合理市场价卖给善意丙，并已现实交付", "C. 甲将盗窃来的金项链卖给善意的丁，丁已支付合理价款", "D. 甲将房屋卖给戊，戊明知甲非登记所有权人"], "answer": 1, "explain": "【法理分析】《民法典》第311条善意取得要件：无权处分人转让、受让人受让时善意、合理价格、已完成交付或登记。B选项完全符合。"}, {"id": "s_67", "type": "single", "title": "67. 【考点：善意取得与占有改定争议】甲将画作卖给乙，约定甲继续借用（占有改定）。甲随后又将该画卖给不知情的丙，亦约定占有改定。丙能否主张善意取得？（ ）", "options": ["A. 能，占有改定属于合法交付方式", "B. 不能，占有改定未完成现实占有的移转，受让人未获得公信外观", "C. 能，因为丙支付了合理价格", "D. 能，因为甲丙合同有效"], "answer": 1, "explain": "【法理分析】通说与《最高人民法院关于适用〈民法典〉物权编的解释（一）》第17条排除占有改定作为善意取得的即时交付方式，因受让人未取得占有公信外观。"}, {"id": "s_68", "type": "single", "title": "68. 【考点：脱手物与盗赃物/遗失物追回】甲的项链被偷，小偷乙卖给不知情的丙。甲发现后请求丙返还。下列表述正确的是（ ）", "options": ["A. 丙已经善意取得项链所有权，甲无权追回", "B. 甲有权自知道或应当知道受让人丙之日起2年内请求丙返还原物", "C. 甲只能要求小偷赔偿，不能向丙追回", "D. 丙可以永久拒绝返还"], "answer": 1, "explain": "【法理分析】《民法典》第312条遗失物/盗赃物等脱手物原则上不适用善意取得。所有权人有权自知道或应当知道受让人之日起2年内请求返还原物。"}, {"id": "s_69", "type": "single", "title": "69. 【考点：有偿拍卖/公开市场购得遗失物之补偿】甲遗失的手表被乙拾得后在公开拍卖会上卖给不知情的丙。甲向丙请求返还手表时，下列表述正确的是（ ）", "options": ["A. 甲无权请求返还", "B. 甲请求返还时，应当支付丙购买该手表的费用", "C. 丙可以拒绝返还并要求取得所有权", "D. 甲只需向乙追偿，不能向丙主张"], "answer": 1, "explain": "【法理分析】《民法典》第312条后半段：受让人通过拍卖或者向具有经营资格的经营者购得该遗失物的，权利人请求返还原物时应当支付受让人所付的费用。"}, {"id": "s_70", "type": "single", "title": "70. 【考点：诈骗物与委托物（脱手物 vs 非脱手物）】甲被诈骗将名画交付给乙，乙将画卖给善意的丙并完成交付。丙能否取得所有权？（ ）", "options": ["A. 不能，诈骗物属于脱手物", "B. 能，诈骗系基于受害人意思交付，属于委托物（非脱手物），丙可依据第311条善意取得", "C. 不能，因为乙构成刑事犯罪", "D. 能，但甲可以在2年内追回"], "answer": 1, "explain": "【法理分析】因欺诈、胁迫而交付的财产属于“占有委托物”（非脱手物），因原所有权人系自愿交付占有，善意受让人可依据第311条取得所有权。"}, {"id": "s_71", "type": "single", "title": "71. 【考点：返还原物请求权之相对人】甲的机器被乙盗窃，乙将机器出租给不知情的丙使用。甲主张返还原物请求权，相对人应为（ ）", "options": ["A. 仅能是乙", "B. 丙作为直接无权占有人，甲可对其主张返还原物请求权", "C. 只能是丙，乙不再承担任何责任", "D. 甲不能主张物上请求权"], "answer": 1, "explain": "【法理分析】《民法典》第235条返还原物请求权的相对人为现时的无权占有人（包括直接占有人丙和间接占有人乙）。"}, {"id": "s_72", "type": "single", "title": "72. 【考点：物上请求权与诉讼时效（民法典第196条）】下列物权请求权中，适用3年诉讼时效规定的是（ ）", "options": ["A. 不动产物权人请求无权占有人返还原物", "B. 登记的动产物权人请求无权占有人返还原物", "C. 未登记的动产物权人请求无权占有人返还原物", "D. 物权人请求排除妨害、消除危险"], "answer": 2, "explain": "【法理分析】《民法典》第196条：不动产物权和登记的动产物权人请求返还原物不适用诉讼时效；未登记的动产物权人请求返还原物适用诉讼时效。"}, {"id": "s_73", "type": "single", "title": "73. 【考点：物上请求权与归责要件】乙在甲的土地上堆放渣土，妨害甲的使用，但乙主张自己无过错。甲请求乙清除渣土（排除妨害），下列表述正确的是（ ）", "options": ["A. 排除妨害请求权以乙主观上有过错为要件", "B. 排除妨害请求权不以乙主观过错为要件，只要存在客观妨害即可", "C. 甲必须证明自己遭受了实际财产损失", "D. 甲只能主张侵权损害赔偿"], "answer": 1, "explain": "【法理分析】物上请求权（排除妨害、消除危险、返还原物）系物权圆满状态受干涉时的防御性请求权，不以相对人主观过错和实际损害为要件。"}, {"id": "s_74", "type": "single", "title": "74. 【考点：无权占有人与所有权人间的费用返还（民法典第460条）】善意占有人乙占有甲的房屋期间，支出必要维修费5000元，支出改装豪华灯具费10000元。甲请求乙返还房屋时，费用补偿规则为（ ）", "options": ["A. 乙有权请求甲支付必要修理费5000元，但无权强求甲支付有益费用（改装费）", "B. 乙有权请求甲支付15000元全部费用", "C. 善意占有人无权请求任何费用返还", "D. 仅恶意占有人有权请求必要费用"], "answer": 0, "explain": "【法理分析】《民法典》第460条：不动产或者动产被占有的，权利人可以请求返还原物及其孳息；占有人因维护该不动产或者动产支出的必要费用，有权请求权利人支付（善意占有人享有必要费用返还请求权）。"}, {"id": "s_75", "type": "single", "title": "75. 【考点：恶意占有人与孳息返还（民法典第459-460条）】恶意占有人乙明知房屋属于甲而强行占有并出租，收取租金5万元。甲请求返还时（ ）", "options": ["A. 乙可保留全部租金", "B. 乙应当返还房屋及收取的5万元孳息（租金），且无权请求必要费用", "C. 乙只需返还房屋，租金属于劳动所得", "D. 乙可以扣除维修费后返还剩余租金"], "answer": 1, "explain": "【法理分析】《民法典》第459条、460条：恶意占有人应对占有物毁损灭失承担赔偿责任，应当返还原物及其孳息（租金为法定孳息），且无权请求必要的维护费用。"}, {"id": "s_76", "type": "single", "title": "76. 【考点：物权法定原则的边界】下列关于物权法定原则及其效力的表述，正确的是（ ）", "options": ["A. 当事人可以通过合同创设法律未规定的物权类型", "B. 违反物权法定原则的物权创设行为不产生物权效力，但合同本身可能有效", "C. 行政法规和地方性法规可以自由设定物权种类", "D. 习惯法在任何情况下均绝对不得作为物权创设的依据"], "answer": 1, "explain": "【法理分析】《民法典》第116条规定物权法定原则。物权种类和内容由法律规定，行政法规等不得创设物权；违反物权法定导致物权创设不生效，但不必然导致债权合同无效（区分原则）。"}, {"id": "s_77", "type": "single", "title": "77. 【考点：一物一权原则与物权客体】关于一物一权原则与物权客体特定原则，下列表述正确的是（ ）", "options": ["A. 一套房屋中的主卧可以单独设立所有权", "B. 正在建造中的建筑物在具备房屋雏形时可以成为物权的客体", "C. 集合物上只能设立一个所有权，不能设立多个物权", "D. 动产浮动抵押违反了一物一权原则，因其客体不确定"], "answer": 1, "explain": "【法理分析】正在建造的建筑物（在建工程）属于特定物，可以设立抵押权（第395条），符合一物一权与客体特定原则；房屋部分房间不能独立设立所有权。"}, {"id": "s_78", "type": "single", "title": "78. 【考点：物权与债权的效力对比】甲将画作卖给乙，后又将该画卖给丙并当场交付给丙。下列关于物权与债权效力的说法，正确的是（ ）", "options": ["A. 乙基于先签订的买卖合同享有优先于丙取得画作所有权的效力", "B. 丙基于现实交付取得画作所有权，体现了物权的对世性与优先效力", "C. 甲乙之间的买卖合同因侵犯丙的物权而无效", "D. 乙可以对丙主张物上请求权要求返还画作"], "answer": 1, "explain": "【法理分析】物权具有优先效力与排他性，动产交付后丙取得所有权。债权具有平等性，乙不能以先签订合同对抗丙取得的物权，只能要求甲承担违约责任。"}, {"id": "s_79", "type": "single", "title": "79. 【考点：物权公示与公信原则】关于物权的公示原则与公信原则，下列表述正确的是（ ）", "options": ["A. 公示原则旨在解决物权变动的外在表现，公信原则旨在保护对公示产生信赖的善意第三人", "B. 不动产登记簿记载错误时，真权利人绝对无法追回不动产", "C. 动产占有不具有公信力，仅不动产登记具有公信力", "D. 公示是物权变动的唯一必要要件，法律绝无例外"], "answer": 0, "explain": "【法理分析】公示原则解决物权变动的外部表征（登记或交付）；公信原则赋予公示以法律信任效力，保护善意第三人信赖利益。"}, {"id": "s_80", "type": "single", "title": "80. 【考点：区分原则（民法典第215条）】甲与乙签订房屋买卖合同，约定一个月后办理过户。次日房屋因不可抗力毁损。下列表述正确的是（ ）", "options": ["A. 房屋买卖合同因标的物灭失而自始无效", "B. 未办理过户登记不影响买卖合同的效力，合同自成立时生效", "C. 房屋所有权已随合同生效而转移给乙", "D. 乙可以要求登记机关直接补办过户"], "answer": 1, "explain": "【法理分析】《民法典》第215条区分原则：物权未变动不影响买卖合同效力。合同成立生效后，风险负担依据第604条交付原则确定。"}], "tfs": [{"id": "tf_1", "type": "tf", "title": "1. 【判断题】物权是绝对权，其排他性意味着在同一物上绝不能同时设立两个以上的物权。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。同一物上可以设立多个不相冲突的物权（如所有权与抵押权、数个顺位抵押权并存）。"}, {"id": "tf_2", "type": "tf", "title": "2. 【判断题】根据区分原则，未办理不动产登记的，不动产买卖合同一律无效。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。《民法典》第215条确立区分原则，未登记不影响合同效力。"}, {"id": "tf_3", "type": "tf", "title": "3. 【判断题】预告登记后，未经预告登记的权利人同意处分该不动产的，不发生物权效力。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。《民法典》第221条明确规定预告登记的防范处分与物权封锁效力。"}, {"id": "tf_4", "type": "tf", "title": "4. 【判断题】因继承取得物权的，自继承开始（被继承人死亡）时发生效力，无需办理登记。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。《民法典》第230条法定物权变动规则。"}, {"id": "tf_5", "type": "tf", "title": "5. 【判断题】占有改定可以作为善意取得制度中即时取得动产所有权的合法交付方式。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。司法解释排除占有改定作为善意取得的即时交付，因未实现外部占有公示。"}, {"id": "tf_6", "type": "tf", "title": "6. 【判断题】欺诈所得的财物属于“占有委托物”，善意受让人可依据第311条善意取得所有权。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。因受骗交付属于自愿交付占有，属于非脱手物，适用善意取得。"}, {"id": "tf_7", "type": "tf", "title": "7. 【判断题】物权请求权（返还原物、排除妨害）以加害人主观上有过错为构成要件。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。物物请求权系圆满状态受干涉时的防御权，不以过错或损害为要件。"}, {"id": "tf_8", "type": "tf", "title": "8. 【判断题】不动产物权人和登记的动产物权人请求返还原物，不适用诉讼时效的规定。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。《民法典》第196条明确排除时效适用。"}, {"id": "tf_9", "type": "tf", "title": "9. 【判断题】恶意占有人有权向所有权人主张返还占有期间支出的必要维修费用。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。《民法典》第460条规定仅善意占有人享有必要费用返还请求权。"}, {"id": "tf_10", "type": "tf", "title": "10. 【判断题】违章建筑因无法办理登记不能取得所有权，但建造人对其享有占有事实保护。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。违章建筑虽无所有权，但建造人享有占有事实及占有保护请求权（第462条）。"}, {"id": "tf_11", "type": "tf", "title": "11. 【判断题】物权是绝对权，其排他性意味着在同一物上绝不能同时设立两个以上的物权。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。同一物上可以设立多个不相冲突的物权（如所有权与抵押权、数个顺位抵押权并存）。"}, {"id": "tf_12", "type": "tf", "title": "12. 【判断题】根据区分原则，未办理不动产登记的，不动产买卖合同一律无效。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。《民法典》第215条确立区分原则，未登记不影响合同效力。"}, {"id": "tf_13", "type": "tf", "title": "13. 【判断题】预告登记后，未经预告登记的权利人同意处分该不动产的，不发生物权效力。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。《民法典》第221条明确规定预告登记的防范处分与物权封锁效力。"}, {"id": "tf_14", "type": "tf", "title": "14. 【判断题】因继承取得物权的，自继承开始（被继承人死亡）时发生效力，无需办理登记。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。《民法典》第230条法定物权变动规则。"}, {"id": "tf_15", "type": "tf", "title": "15. 【判断题】占有改定可以作为善意取得制度中即时取得动产所有权的合法交付方式。", "options": ["正确", "错误"], "answer": 1, "explain": "【解析】错误。司法解释排除占有改定作为善意取得的即时交付，因未实现外部占有公示。"}, {"id": "tf_16", "type": "tf", "title": "16. 【判断题】欺诈所得的财物属于“占有委托物”，善意受让人可依据第311条善意取得所有权。", "options": ["正确", "错误"], "answer": 0, "explain": "【解析】正确。因受骗交付属于自愿交付 let wrongWeights = JSON.parse(localStorage.getItem('property_law_weights_v8') || '{}');
let favorites = JSON.parse(localStorage.getItem('property_law_favs_v8') || '{}');

function saveState() {
    localStorage.setItem('property_law_weights_v8', JSON.stringify(wrongWeights));
    localStorage.setItem('property_law_favs_v8', JSON.stringify(favorites));
    updateMistakeCountDisplay();
}

function getWeight(id) { return wrongWeights[id] || 1; }
function setWrong(id) { wrongWeights[id] = (wrongWeights[id] || 1) + 3; saveState(); }

function weightedSample(list, k) {
    let temp = [...list];
    let result = [];
    for (let i = 0; i < k && temp.length > 0; i++) {
        let totalWeight = temp.reduce((sum, item) => sum + getWeight(item.id), 0);
        let randomNum = Math.random() * totalWeight;
        let current = 0;
        for (let j = 0; j < temp.length; j++) {
            current += getWeight(temp[j].id);
            if (randomNum <= current) {
                result.push(temp[j]);
                temp.splice(j, 1);
                break;
            }
        }
    }
    return result;
}

let currentSuite = [];
let currentSuiteIndex = 0;
let suiteScore = 0;
let currentAnswered = false;

function generateNewSuite() {
    let sPicked = weightedSample(db.singles, 8);
    let tfPicked = weightedSample(db.tfs, 10);
    let casePickedArr = weightedSample(db.cases, 1);
    let casePicked = casePickedArr[0];

    let caseSubItems = (casePicked && casePicked.subQuestions ? casePicked.subQuestions : []).map((sq, idx) => ({
        id: `${casePicked.id}_sub_${idx}`,
        type: "case_sub",
        caseContext: casePicked.context,
        title: `【案例题 - 设问 ${idx + 1}/3】${sq.title}`,
        options: sq.options,
        answer: sq.answer,
        explain: sq.explain
    }));

    currentSuite = [...sPicked, ...tfPicked, ...caseSubItems];
    currentSuiteIndex = 0;
    suiteScore = 0;

    document.getElementById('result-card').classList.add('hidden');
    document.getElementById('question-card').classList.remove('hidden');

    renderCurrentQuestion();
}

function updateMistakeCountDisplay() {
    let count = Object.keys(wrongWeights).filter(k => wrongWeights[k] > 1).length;
    document.getElementById('mistake-count-display').innerText = count;
}

function renderCurrentQuestion() {
    currentAnswered = false;
    let q = currentSuite[currentSuiteIndex];

    document.getElementById('current-index-display').innerText = `${currentSuiteIndex + 1}/${currentSuite.length}`;
    document.getElementById('suite-score-display').innerText = suiteScore;

    let badge = document.getElementById('question-type-badge');
    if (q.type === 'single') badge.innerText = '单选题';
    else if (q.type === 'tf') badge.innerText = '判断题';
    else badge.innerText = '案例综合题';

    let caseBox = document.getElementById('case-context-box');
    if (q.type === 'case_sub') {
        caseBox.classList.remove('hidden');
        document.getElementById('case-text').innerText = q.caseContext;
    } else {
        caseBox.classList.add('hidden');
    }

    document.getElementById('question-text').innerText = q.title;

    let optsContainer = document.getElementById('options-container');
    optsContainer.innerHTML = '';
    q.options.forEach((optText, idx) => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${optText}</span>`;
        btn.onclick = () => selectOption(idx);
        optsContainer.appendChild(btn);
    });

    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('next-btn').disabled = true;

    let w = getWeight(q.id);
    document.getElementById('weight-tip').innerText = w > 1 ? `⚠️ 高频错题（当前抽取概率: ${w}x）` : '';

    let favBtn = document.getElementById('fav-btn');
    if (favorites[q.id]) {
        favBtn.classList.add('active');
        favBtn.innerText = '★ 已标记错题';
    } else {
        favBtn.classList.remove('active');
        favBtn.innerText = '⭐ 标记错题/收藏';
    }
}

function selectOption(selectedIdx) {
    if (currentAnswered) return;
    currentAnswered = true;

    let q = currentSuite[currentSuiteIndex];
    let buttons = document.querySelectorAll('#options-container .option-btn');

    buttons.forEach(b => b.disabled = true);

    let isCorrect = (selectedIdx === q.answer);

    if (isCorrect) {
        buttons[selectedIdx].classList.add('selected-correct');
        document.getElementById('result-status').innerText = '✅ 回答正确！';
        document.getElementById('result-status').style.color = 'var(--success-color)';
        suiteScore += 5;
    } else {
        buttons[selectedIdx].classList.add('selected-wrong');
        if (buttons[q.answer]) buttons[q.answer].classList.add('show-correct');
        document.getElementById('result-status').innerText = '❌ 回答错误！';
        document.getElementById('result-status').style.color = 'var(--danger-color)';
        setWrong(q.id);
    }

    // 显示法理分析解析
    let expText = q.explain || "【法理分析】暂无详细解析";
    document.getElementById('explanation-text').innerText = expText;
    document.getElementById('explanation-box').style.display = 'block';

    document.getElementById('next-btn').disabled = false;
    document.getElementById('suite-score-display').innerText = suiteScore;
}

function nextQuestion() {
    if (currentSuiteIndex < currentSuite.length - 1) {
        currentSuiteIndex++;
        renderCurrentQuestion();
    } else {
        showFinalResults();
    }
}

function showFinalResults() {
    document.getElementById('question-card').classList.add('hidden');
    document.getElementById('result-card').classList.remove('hidden');

    let maxScore = currentSuite.length * 5;
    document.getElementById('final-score').innerText = `${suiteScore} / ${maxScore} 分`;

    let rate = suiteScore / maxScore;
    let evalText = rate >= 0.9 ? "优秀！物权法掌握非常扎实！" : (rate >= 0.7 ? "良好！部分复杂问题仍需巩固。" : "建议重新复习课程笔记！");
    document.getElementById('final-eval').innerText = evalText;
}

function toggleFavorite() {
    let q = currentSuite[currentSuiteIndex];
    if (favorites[q.id]) {
        delete favorites[q.id];
        wrongWeights[q.id] = 1;
    } else {
        favorites[q.id] = true;
        wrongWeights[q.id] = (wrongWeights[q.id] || 1) + 3;
    }
    saveState();
    renderCurrentQuestion();
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('quiz-view').classList.add('hidden');
    document.getElementById('mistakes-view').classList.add('hidden');
    document.getElementById('all-view').classList.add('hidden');

    if (tab === 'quiz') {
        event.target.classList.add('active');
        document.getElementById('quiz-view').classList.remove('hidden');
    } else if (tab === 'mistakes') {
        event.target.classList.add('active');
        document.getElementById('mistakes-view').classList.remove('hidden');
        renderMistakesList();
    } else if (tab === 'all') {
        event.target.classList.add('active');
        document.getElementById('all-view').classList.remove('hidden');
        renderAllQuestionsList();
    }
}

function renderMistakesList() {
    let container = document.getElementById('mistakes-list');
    container.innerHTML = '';
    let mKeys = Object.keys(wrongWeights).filter(k => wrongWeights[k] > 1);
    if (mKeys.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">暂无错题记录，多做练习答错后会自动搜集错题！</p>';
        return;
    }
    mKeys.forEach(id => {
        let div = document.createElement('div');
        div.className = 'q-item-box';
        div.innerHTML = `<strong>[错题ID: ${id}] (当前加权: ${wrongWeights[id]}x)</strong> - 下次抽取套题时被抽中的概率自动增加。`;
        container.appendChild(div);
    });
}

function renderAllQuestionsList() {
    let container = document.getElementById('all-questions-list');
    container.innerHTML = '';

    let h3_1 = document.createElement('h3');
    h3_1.style.margin = '20px 0 10px 0';
    h3_1.innerText = `一、单选题全集 (共 ${db.singles.length} 题)`;
    container.appendChild(h3_1);

    db.singles.forEach((q, idx) => {
        let item = document.createElement('div');
        item.className = 'q-item-box';
        item.innerHTML = `<div class="q-item-title">${idx + 1}. ${q.title}</div>
            <div>选项：${q.options.join(' | ')}</div>
            <div style="font-weight:bold; color:var(--success-color); margin-top:5px;">正确答案：${q.options[q.answer]}</div>
            <div class="q-item-exp">${q.explain || '【法理分析】暂无'}</div>`;
        container.appendChild(item);
    });

    let h3_2 = document.createElement('h3');
    h3_2.style.margin = '30px 0 10px 0';
    h3_2.innerText = `二、判断题全集 (共 ${db.tfs.length} 题)`;
    container.appendChild(h3_2);

    db.tfs.forEach((q, idx) => {
        let item = document.createElement('div');
        item.className = 'q-item-box';
        item.innerHTML = `<div class="q-item-title">${idx + 1}. ${q.title}</div>
            <div style="font-weight:bold; color:var(--success-color);">正确答案：${q.options[q.answer]}</div>
            <div class="q-item-exp">${q.explain || '【解析】暂无'}</div>`;
        container.appendChild(item);
    });

    let h3_3 = document.createElement('h3');
    h3_3.style.margin = '30px 0 10px 0';
    h3_3.innerText = `三、案例分析题全集 (共 ${db.cases.length} 案例)`;
    container.appendChild(h3_3);

    db.cases.forEach((c, idx) => {
        let item = document.createElement('div');
        item.className = 'q-item-box';
        let subsHtml = c.subQuestions.map((sq, sidx) => `
            <div style="margin-top:10px; padding-top:8px; border-top:1px dashed #e2e8f0;">
                <strong>设问 ${sidx+1}: ${sq.title}</strong><br>
                <span>选项：${sq.options.join(' | ')}</span><br>
                <span style="font-weight:bold; color:var(--success-color);">正确答案：${sq.options[sq.answer]}</span>
                <div class="q-item-exp">${sq.explain || '【解析】暂无'}</div>
            </div>
        `).join('');

        item.innerHTML = `<div class="q-item-title">案例 ${idx + 1}：${c.context}</div>${subsHtml}`;
        container.appendChild(item);
    });
}

window.onload = function() {
    updateMistakeCountDisplay();
    generateNewSuite();
};
